name: Recover stuck Pages deployment
on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the timed-out Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/pages-cancel-response -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/bangkokailab-glitch/k2-guide01-preview/pages/deployments/47518e53b6845967aa0eb34ebe7a4fa258107e8c/cancel")
          echo "Pages cancellation HTTP status: ${status}"
          if [ "${status}" != "204" ]; then
            cat /tmp/pages-cancel-response
            exit 1
          fi
